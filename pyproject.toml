[project]
name = "audit-orchestrator"
version = "0.3.0"
description = "MCP server for orchestrating security audits using local LLM and MCP Kali"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.6.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
audit-orchestrator-mcp = "audit_orchestrator.mcp_server:main"
audit-orchestrator-live = "audit_orchestrator.live_console:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
audit_orchestrator = ["audit_profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
